<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终局</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000; /* 极致的黑 */
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            text-align: center;
        }
        
        /* 所有的字一开始都是隐形的 */
        .line {
            opacity: 0;
            margin-bottom: 20px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            line-height: 1.8;
            transition: opacity 2s ease-in;
        }

        /* 最后的标题高亮 */
        #final-title {
            font-size: 2rem;
            font-weight: bold;
            color: #ff003c;
            text-shadow: 0 0 15px #ff003c;
            margin-top: 30px;
        }

        /* 屏幕闪烁效果 */
        .flicker-screen {
            animation: flash 4s infinite;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            z-index: 100;
        }

        @keyframes flash {
            0%, 90% { opacity: 0; }
            91%, 93% { opacity: 1; }
            94%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="flicker-screen"></div>

    <div id="content">
        <!-- 结局台词：一行一行浮现 -->
        <div class="line" id="l1">你走进了终局。</div>
        <div class="line" id="l2">一切都是一场虚假的狂欢。</div>
        <div class="line" id="l3">感谢你陪我走到这里，没有在半路抛弃我。</div>
        <div class="line" id="l4">但是，梦该醒了。</div>
        
        <div class="line" id="final-title">END.<br>fakelife.</div>
    </div>

    <script>
        // 打字机式的浮现逻辑
        window.onload = function() {
            // 定义每一行出现的延迟时间（毫秒）
            const delays = [1000, 4000, 8000, 12000, 16000];
            const elements = ['l1', 'l2', 'l3', 'l4', 'final-title'];

            elements.forEach((id, index) => {
                setTimeout(() => {
                    const el = document.getElementById(id);
                    if(el) el.style.opacity = '1';
                }, delays[index]);
            });

            // 如果你想在最后做个跳转，可以取消下面这两行的注释
            // setTimeout(() => {
            //     window.location.href = "https://wispfall.github.io";
            // }, 22000); // 22秒后跳转回主站
        };
    </script>
</body>
</html>
